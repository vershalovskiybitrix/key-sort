<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Настройки Key Sort</title><link rel="icon" href="favicon.ico" sizes="16x16"><link rel="stylesheet" href="options.css"></head><body><main><h1>Key Sort — API Яндекса</h1>
<section><h2>Wordstat API</h2><label>API-ключ Yandex Cloud<span class="secret"><input id="cloudApiKey" type="password" autocomplete="off"><button type="button" data-eye="cloudApiKey" aria-label="Показать ключ">Показать</button></span></label><label>ID каталога<input id="folderId" type="text" autocomplete="off"></label><a href="https://aistudio.yandex.cloud/" target="_blank" rel="noreferrer noopener">Открыть Yandex AI Studio для создания API-ключа</a><p class="help">Справа сверху нажмите «Создать API-ключ» → «Создать». Скопируйте секретную часть ключа. ID каталога копируется сверху рядом с названием каталога.</p></section>
<section><h2>Прогноз бюджета Яндекс Директа</h2><label>OAuth-токен Директа<span class="secret"><input id="directOAuthToken" type="password" autocomplete="off"><button type="button" data-eye="directOAuthToken" aria-label="Показать токен">Показать</button></span></label></section>
<div class="save-row"><button id="save" type="button">Сохранить</button><span id="status" role="status"></span></div></main><script src="options.js"></script></body></html>
