<!doctype html><html lang="ru" class="service-page"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Парсинг ключей — Key Sort</title><link rel="icon" href="assets/favicon.ico?v=1" sizes="16x16"><link rel="stylesheet" href="assets/app.css?v=14"><link rel="stylesheet" href="assets/services.css?v=14"></head><body>
<header class="site-header"><div class="site-header-inner"><a class="site-logo" href="/" aria-label="На главную Key Sort"><img src="assets/vcg-logo.png" alt="Vershalovskiy Consulting Group"></a><div class="site-tool-title"><h1>Парсинг ключей</h1><div class="subtitle">Wordstat API</div></div><div class="site-contacts">Telegram: <a href="https://t.me/vershalovskiy" target="_blank" rel="nofollow noreferrer noopener">@vershalovskiy</a><br>E-mail: <a href="mailto:vcg@vershalovskiy.com">vcg@vershalovskiy.com</a></div></div></header>
<main>
<div class="extension-toolbar"><div class="extension-state" data-extension-state><strong>Chrome-расширение</strong><span data-extension-label>Проверка…</span><button class="field-button" type="button" data-extension-settings>Настройки расширения</button></div><div class="services-menu-root" data-services-menu></div></div>
<section class="panel"><form class="service-form" id="parserForm"><div class="service-grid parser-fields">
  <div class="parser-primary">
    <label class="service-field">Запрос<input id="parserQuery" required autocomplete="off" placeholder="психолог"></label>
    <div class="service-field"><span id="parserRegionLabel">Регион</span><div class="region-picker" id="parserRegions" role="group" aria-labelledby="parserRegionLabel"></div></div>
  </div>
  <label class="service-field">Минус-слова<textarea class="service-textarea parser-minus" id="parserMinus" rows="8" placeholder="по одному слову или через пробел"></textarea></label>
</div>
<div class="parser-actions"><button class="field-button" id="parserCollect" type="submit">Собрать</button><button class="field-button" id="parserClear" type="button">Очистить</button><button class="field-button" id="parserDeeperOne" type="button" disabled>Собрать глубже на 1 уровень</button><button class="field-button" id="parserDeeperTwo" type="button" disabled>Собрать глубже на 2 уровня</button></div></form><div class="service-status" id="parserStatus"></div></section>
<section class="panel"><div class="panel-head"><div><h2 class="panel-title">Результат</h2><div class="help" id="parserTotal">Уникальных фраз: 0. Пройдено уровней: 0.</div></div><button class="field-button" id="parserCopy" type="button">Скопировать</button></div><div class="data-table-wrap"><table class="data-table"><thead><tr><th>Фраза</th><th>Частотность</th></tr></thead><tbody id="parserResults"></tbody></table></div></section>
